name: Build DC Notifier APK

on:
  push:
    paths:
      - 'dc-notifier/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: gradle -p dc-notifier assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DCNotifier-APK
          path: dc-notifier/app/build/outputs/apk/debug/app-debug.apk
